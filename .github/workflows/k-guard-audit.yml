name: K-Guard Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  k-guard-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install K-Guard
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-evidence.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Run regression tests
        run: python -m pytest -q
      - name: Run 500-target inner-core product gate
        run: python scripts/inner_core_product_gate.py --targets 500 --output tmp/inner-core-product-gate-500.json --markdown tmp/inner-core-product-gate-500.md --html tmp/inner-core-product-gate-500.html
      - name: Generate K-Guard SARIF self-scan
        env:
          K_GUARD_EVIDENCE_HMAC_KEY: ${{ secrets.K_GUARD_EVIDENCE_HMAC_KEY }}
        run: python -m k_guard_mcp.cli scan . --sarif k-guard.sarif --no-flow > k-guard-self-scan.json
      - name: Upload self-scan JSON
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k-guard-self-scan
          path: k-guard-self-scan.json
      - name: Upload inner-core evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: inner-core-product-gate-500
          path: |
            tmp/inner-core-product-gate-500.json
            tmp/inner-core-product-gate-500.md
            tmp/inner-core-product-gate-500.html
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3
        if: always()
        with:
          sarif_file: k-guard.sarif
