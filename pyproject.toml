[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k-guard-mcp"
version = "0.1.0"
description = "Korean-specialized senior-style pre-release auditor and fail-closed Guardian gate for vibe-coded apps."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]
dependencies = [
  "mcp>=1.28.1,<2",
  "httpx>=0.28.1,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.2,<7",
  "PyJWT>=2.13.0",
  "sqlglot>=30.12.0,<31",
  "tree-sitter==0.26.0",
  "tree-sitter-java==0.23.5"
]
keywords = ["mcp", "vibe-coding", "privacy", "korean", "release-gate", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/windmillstudio/k-guard-mcp"
Repository = "https://github.com/windmillstudio/k-guard-mcp"
Issues = "https://github.com/windmillstudio/k-guard-mcp/issues"

[project.optional-dependencies]
mcp = [
  "mcp>=1.28.1,<2"
]
dev = [
  "coverage[toml]>=7.0.0",
  "packaging>=24.2",
  "pytest>=8.0.0"
]

[project.scripts]
k-guard = "k_guard_mcp.cli:main"
k-guard-dashboard = "k_guard_mcp.dashboard:main"
k-guard-mcp = "k_guard_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"k_guard_mcp" = [
  "assets/*.png",
  "analyzer_profiles/*.yml",
  "schemas/*.json",
  "validation_packs/java-kotlin-go/*.json",
  "validation_packs/java-kotlin-go/fixtures/java/*.java",
  "validation_packs/java-kotlin-go/fixtures/kotlin/*.kt",
  "validation_packs/java-kotlin-go/fixtures/go/*.go",
  "validation_packs/java-kotlin-go/fixtures/php/*.php",
  "validation_packs/java-kotlin-go/fixtures/ruby/*.rb",
  "validation_packs/java-kotlin-go/fixtures/csharp/*.cs",
  "validation_packs/java-kotlin-go/fixtures/python/*.py",
  "validation_packs/java-kotlin-go/fixtures/javascript/*.js",
  "validation_packs/java-kotlin-go/fixtures/typescript/*.ts",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["k_guard_mcp"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
