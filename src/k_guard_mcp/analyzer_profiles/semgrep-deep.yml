# K-Guard Semgrep Community Edition profile.
# All taint analysis is intrafile. These rules do not claim interfile data flow,
# and authorization-adjacent matches require ownership and policy review.
rules:
  - id: k-guard.javascript.http-to-sql
    languages: [javascript, typescript]
    mode: taint
    message: "Untrusted HTTP input reaches a SQL execution API."
    severity: ERROR
    metadata:
      category: sql-injection
      cwe: ["CWE-89"]
      confidence: high
      k_guard_severity: high
      summary: "Untrusted HTTP input reaches a SQL execution API."
      recommendation: "Use a parameterized query or a query builder that binds values separately from SQL text."
      analyzer_subtype: semgrep-ce-intrafile
      analysis_scope: intrafile
      ce_interfile: false
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query
          - pattern: $REQ.query.$KEY
          - pattern: $REQ.query[$KEY]
          - pattern: $REQ.body
          - pattern: $REQ.body.$KEY
          - pattern: $REQ.body[$KEY]
          - pattern: $REQ.params.$KEY
          - pattern: $REQ.params[$KEY]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($VALUE, ...)
              - pattern: $DB.execute($VALUE, ...)
              - pattern: $DB.raw($VALUE, ...)
          - focus-metavariable: $VALUE

  - id: k-guard.javascript.http-to-command
    languages: [javascript, typescript]
    mode: taint
    message: "Untrusted HTTP input reaches an operating-system command API."
    severity: ERROR
    metadata:
      category: command-injection
      cwe: ["CWE-78"]
      confidence: high
      k_guard_severity: critical
      summary: "Untrusted HTTP input reaches an operating-system command API."
      recommendation: "Avoid shell execution; use a fixed executable and an allowlisted argument vector."
      analyzer_subtype: semgrep-ce-intrafile
      analysis_scope: intrafile
      ce_interfile: false
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$KEY
          - pattern: $REQ.query[$KEY]
          - pattern: $REQ.body.$KEY
          - pattern: $REQ.body[$KEY]
          - pattern: $REQ.params.$KEY
          - pattern: $REQ.params[$KEY]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($VALUE, ...)
              - pattern: $CP.execSync($VALUE, ...)
              - pattern: '$CP.spawn($VALUE, ..., {shell: true, ...})'
          - focus-metavariable: $VALUE

  - id: k-guard.javascript.http-to-file-path
    languages: [javascript, typescript]
    mode: taint
    message: "Untrusted HTTP input reaches a filesystem path API."
    severity: ERROR
    metadata:
      category: path-traversal
      cwe: ["CWE-22"]
      confidence: medium
      k_guard_severity: high
      summary: "Untrusted HTTP input reaches a filesystem path API."
      recommendation: "Resolve against a fixed base directory and reject absolute paths, traversal segments, and containment escapes."
      analyzer_subtype: semgrep-ce-intrafile
      analysis_scope: intrafile
      ce_interfile: false
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$KEY
          - pattern: $REQ.query[$KEY]
          - pattern: $REQ.body.$KEY
          - pattern: $REQ.body[$KEY]
          - pattern: $REQ.params.$KEY
          - pattern: $REQ.params[$KEY]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $FS.readFile($VALUE, ...)
              - pattern: $FS.readFileSync($VALUE, ...)
              - pattern: $FS.createReadStream($VALUE, ...)
              - pattern: $RES.sendFile($VALUE, ...)
          - focus-metavariable: $VALUE

  - id: k-guard.javascript.http-to-ssrf
    languages: [javascript, typescript]
    mode: taint
    message: "Untrusted HTTP input controls an outbound request destination."
    severity: ERROR
    metadata:
      category: ssrf
      cwe: ["CWE-918"]
      confidence: medium
      k_guard_severity: high
      summary: "Untrusted HTTP input controls an outbound request destination."
      recommendation: "Allowlist schemes and destinations, resolve and verify addresses, and block private or link-local networks."
      analyzer_subtype: semgrep-ce-intrafile
      analysis_scope: intrafile
      ce_interfile: false
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.query.$KEY
          - pattern: $REQ.query[$KEY]
          - pattern: $REQ.body.$KEY
          - pattern: $REQ.body[$KEY]
          - pattern: $REQ.params.$KEY
          - pattern: $REQ.params[$KEY]
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($VALUE, ...)
              - pattern: $AXIOS.get($VALUE, ...)
              - pattern: '$AXIOS.request({url: $VALUE, ...})'
              - pattern: $HTTP.get($VALUE, ...)
              - pattern: $HTTP.request($VALUE, ...)
          - focus-metavariable: $VALUE

  - id: k-guard.javascript.direct-object-lookup-from-route-id
    languages: [javascript, typescript]
    message: "A route-controlled identifier is used for a direct object lookup."
    severity: WARNING
    metadata:
      category: authorization-review
      cwe: ["CWE-639"]
      confidence: low
      k_guard_severity: medium
      summary: "A route-controlled identifier is used for a direct object lookup."
      recommendation: "Enforce object ownership or tenant policy in the lookup predicate and test denied cross-user access."
      analyzer_subtype: semgrep-ce-intrafile
      analysis_scope: intrafile-idor-adjacent
      authorization_proof: false
      ce_interfile: false
    pattern-either:
      - pattern: $MODEL.findById($REQ.params.$KEY)
      - pattern: $MODEL.findByPk($REQ.params.$KEY)
      - pattern: '$MODEL.findOne({id: $REQ.params.$KEY, ...})'
      - pattern: '$MODEL.findOne({_id: $REQ.params.$KEY, ...})'

